
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASEZERO | Contact Us</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <h1>CASEZERO</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/signup}">Sign Up</a>
        <a th:href="@{/login}">Sign In</a>
        <a th:href="@{/contact}">Contact Us</a>
    </nav>
</header>

<main>
    <section class="panel">

        <h2>Contact Us</h2>

        <p>
            Have a question or feedback about CASEZERO?
            Send us a message using the form below.
        </p>

        <p th:if="${successMessage}"
           th:text="${successMessage}"
           style="color: green;">
        </p>

        <form th:action="@{/contact}"
              th:object="${form}"
              method="post">
<input type="hidden"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}">
            <label for="name">Full Name</label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   placeholder="Enter your full name"
                   minlength="2"
                   maxlength="80"
                   autocomplete="name"
                   required>

            <p th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}"
               style="color: red;">
            </p>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="Enter your email"
                   maxlength="254"
                   autocomplete="email"
                   required>

            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"
               style="color: red;">
            </p>

            <label for="subject">Subject</label>
            <input type="text"
                   id="subject"
                   th:field="*{subject}"
                   placeholder="Enter message subject"
                   minlength="3"
                   maxlength="100"
                   required>

            <p th:if="${#fields.hasErrors('subject')}"
               th:errors="*{subject}"
               style="color: red;">
            </p>

            <label for="message">Your Message</label>
            <textarea id="message"
                      th:field="*{message}"
                      placeholder="Write your message here"
                      minlength="10"
                      maxlength="2000"
                      rows="5"
                      required></textarea>

            <p th:if="${#fields.hasErrors('message')}"
               th:errors="*{message}"
               style="color: red;">
            </p>

            <button class="button" type="submit">
                Send Message
            </button>

        </form>
    </section>
</main>

<footer>
    CASEZERO — Supporting awareness through public information.
</footer>

</body>
</html>
