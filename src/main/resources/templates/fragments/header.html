<header class="site-header" th:fragment="siteHeader" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <a class="site-brand" th:href="@{/}" aria-label="CASEZERO home">
        <span class="brand-mark">CZ</span>
        <span class="brand-word">CASEZERO</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/research}">Research Feed</a>
        <a th:href="@{/community}">Community</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/investigations}">My Investigations</a>
        <a sec:authorize="isAuthenticated()" th:if="${currentMember != null}" th:href="@{/profile}" th:text="${currentMember.name}">My Profile</a>
        <a th:href="@{/contact}">Contact Us</a>
        <a sec:authorize="isAnonymous()" class="nav-signin" th:href="@{/login}">Sign In</a>
        <a sec:authorize="isAnonymous()" class="nav-signup" th:href="@{/signup}">Create Account</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="header-logout-form">
            <button type="submit" class="header-logout">Sign Out</button>
        </form>
    </nav>
</header>
