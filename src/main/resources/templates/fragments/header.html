<header th:fragment="siteHeader" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <a class="site-brand" th:href="@{/}" aria-label="CASEZERO home"><h1>CASEZERO</h1></a>
    <nav aria-label="Main navigation">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/research}">Research Feed</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/investigations}">My Investigations</a>
        <a sec:authorize="isAnonymous()" th:href="@{/signup}">Sign Up</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Sign In</a>
        <a th:href="@{/contact}">Contact Us</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="header-logout-form">
            <button type="submit" class="header-logout">Sign Out</button>
        </form>
    </nav>
</header>
