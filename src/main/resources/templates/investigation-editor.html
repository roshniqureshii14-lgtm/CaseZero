<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CASEZERO | Investigation Editor</title><link rel="stylesheet" th:href="@{/style.css}">
<style>
.editor{max-width:800px;margin:45px auto;padding:0 22px}.editor-panel{background:#1d2026;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:30px}.case-context{color:#f08091;font-size:13px;margin-bottom:22px}.field-error{display:block;color:#ff858d;font-size:13px;margin-top:5px}.hint{color:#9297a2;font-size:12px}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.actions button{width:auto}.cancel{color:#c7c9d0;text-decoration:none;font-size:14px}
</style></head>
<body><header th:replace="~{fragments/header :: siteHeader}"></header>
<main class="editor"><p class="eyebrow">PRIVATE MEMBER WORKSPACE</p><h1 th:text="${pageTitle}">Start an Investigation</h1><p class="case-context" th:text="${'Linked case: ' + caseRecord.title}">Linked case</p>
<section class="editor-panel"><form th:object="${form}" th:action="${draftId != null} ? @{/investigations/{id}/edit(id=${draftId})} : @{/investigations}" method="post">
<input type="hidden" th:field="*{caseId}">
<label for="title">Investigation title</label><input id="title" type="text" th:field="*{title}" maxlength="150" placeholder="Give your research a clear title" required><span class="field-error" th:errors="*{title}"></span>
<label for="findings">Findings and research notes</label><textarea id="findings" th:field="*{findings}" rows="9" maxlength="6000" placeholder="Record sourced observations, timelines, and questions. Avoid presenting allegations as established facts." required></textarea><span class="field-error" th:errors="*{findings}"></span>
<label for="sourceNotes">Sources and reference links</label><textarea id="sourceNotes" th:field="*{sourceNotes}" rows="4" maxlength="3000" placeholder="Publication names, URLs, relevant dates (optional)"></textarea><span class="field-error" th:errors="*{sourceNotes}"></span>
<p class="hint">Do not include private personal information or unsupported accusations.</p><div class="actions"><button type="submit">Save Private Draft</button><a class="cancel" th:href="@{/investigations}">Cancel</a></div>
</form></section></main></body></html>
