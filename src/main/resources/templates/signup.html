
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASEZERO | Sign Up</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>
    <h1>CASEZERO</h1>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/signup}">Sign Up</a>
        <a th:href="@{/login}">Sign In</a>
        <a th:href="@{/contact}">Contact Us</a>
    </nav>
</header>

<main>
    <section class="panel">
        <h2>Create Your Account</h2>
        <p>Join CASEZERO to explore unresolved cases in Pakistan.</p>

        <form th:action="@{/signup}" th:object="${form}" method="post">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}"
                   minlength="2" maxlength="80"
                   autocomplete="name" required>
            <p th:if="${#fields.hasErrors('name')}"
               th:errors="*{name}"></p>

            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}"
                   maxlength="254" autocomplete="email" required>
            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   minlength="8" maxlength="72"
                   autocomplete="new-password" required>
            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   th:field="*{confirmPassword}"
                   minlength="8" maxlength="72"
                   autocomplete="new-password" required>
            <p th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"></p>

            <button class="button" type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a th:href="@{/login}">Sign In</a></p>
    </section>
</main>

<footer>
    CASEZERO — Supporting awareness through public information.
</footer>
</body>
</html>
